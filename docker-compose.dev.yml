services:
  postgres:
    image: postgres:16-alpine
    container_name: musicdatabase-postgres
    profiles: ["dev"]
    environment:
      POSTGRES_DB: musicdatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicdatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=musicdatabase;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: ${Jwt__Key:-dev-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

volumes:
  postgres_data:
