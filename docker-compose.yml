services:
  redis:
    image: redis:7-alpine
    container_name: musicdatabase-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicdatabase-api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=prod-db.example.com;Database=musicdatabase;Username=postgres;Password=postgres}
      ConnectionStrings__Redis: ${ConnectionStrings__Redis:-redis:6379}
      Jwt__Key: ${Jwt__Key:-super-secret-key-change-me-in-production-123}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  redis_data:
