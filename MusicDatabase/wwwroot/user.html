<!DOCTYPE html>

<html>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <h1 id="username"></h1>
        <h2 id="userRole"></h2>
        <div id="favoriteArtists">
            <h2>Favorite Artists</h2>
        </div>
        <div id="favoriteAlbums">
            <h2>Favorite Albums</h2>
        </div>
        <div id="favoriteTracks">
            <h2>Favorite Tracks</h2>
        </div>
        <div id="adminPanel">
            <button id="removeUserBtn">Remove User</button>
        </div>
        <script src='auth.js'></script>
        <script src='trackElement.js'></script>
        <script src="albumElement.js"></script>
        <script src="artistElement.js"></script>
        <script>
            function createRemoveButtonEvent(userId){
                document.getElementById('removeUserBtn').addEventListener('click', async (event) => {
                    let response = await fetch(`user?id=${userId}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (response.ok){
                        alert('Removed successfully.');
                    } else {
                        alert('NotFound');
                    }
                });
            }

            window.onload = async (event) => {
                let params = new URLSearchParams(window.location.search);
                let id = params.get('id');
                let response = await fetch(`user?id=${id}`);
                if (response.ok)
                {
                    let user = await response.json();
                    document.title = user.name;
                    document.getElementById("username").textContent = user.name;
                    document.getElementById("userRole").textContent = user.role;

                    for (let artist of user.favoriteArtists){
                        document.getElementById("favoriteArtists").appendChild(createArtistElement(artist));
                    }
                    for (let album of user.favoriteAlbums){
                        document.getElementById("favoriteAlbums").appendChild(createAlbumElement(album));
                    }
                    for (let track of user.favoriteTracks){
                        document.getElementById("favoriteTracks").appendChild(createTrackElement(track));
                    }

                    if (user.role == 'Admin'){
                        createRemoveButtonEvent(id);
                    }
                }
            }
        </script>
    </body>
</html>
