<!DOCTYPE html>

<html>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <h1 id="artistName"></h1>
        <div id="albumList"></div>
        <div id="adminPanel" style="display: none;"></div>
            <button type="button" id="removeButtonn">Remove</button>
        <script src='auth.js'></script>
        <script>
            let params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            function createRemoveButtonEvent(){
                document.getElementById('removeButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    let response = await fetch(`http://localhost:5000/artist?id=${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                    });
                    if (response.ok){
                        alert('Removed successfully');
                    } else {
                        alert('Album was not removed');
                    }
                });
            }

            window.onload = async () => {
                let response = await fetch(`http://localhost:5000/artist?id=${id}`);
                if (response.ok){
                    let artist = await response.json();
                    document.getElementById('artistName').textContent = artist.name;
                    document.title = artist.name;
                    artist.albums.forEach(a => {
                        let album = document.createElement('div');
                        let title = document.createElement('a');
                        title.href = `http://localhost:5000/album.html?id=${a.id}`;
                        title.textContent = a.title;
                        album.appendChild(title);
                        document.getElementById('albumList').appendChild(album);
                    });
                    let payload = getPayload();
                    if (payload.role == 'Admin'){
                        createRemoveButtonEvent();
                        document.getElementById('adminPanel').style.display = 'none';
                    }
                } else {
                    alert('not found');
                }
            }
        </script>
    </body>
</html>
