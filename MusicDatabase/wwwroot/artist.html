<!DOCTYPE html>

<html>
    <body>
        <h1 id="artistName"></h1>
        <div id="albumList"></div>
        <div id="adminPanel"></div>
        <script src='auth.js'></script>
        <script>
            window.onload = async () => {
                let params = new URLSearchParams(window.location.search);
                let id = params.get('id');
                let response = await fetch(`http://localhost:5000/artist?id=${id}`);
                if (response.ok){
                    let artist = await response.json();
                    document.getElementById('artistName').textContent = artist.name;
                    document.title = artist.name;
                    artist.albums.forEach(a => {
                        let album = document.createElement('div');
                        let title = document.createElement('a');
                        title.href = `http://localhost:5000/album.html?id=${a.id}`;
                        title.textContent = a.title;
                        album.appendChild(title);
                        document.getElementById('albumList').appendChild(album);
                    });
                    let payload = getPayload();
                    if (payload.role == 'Admin')
                    {
                        let removeBtn = document.createElement('button');
                        removeBtn.id = 'removeAlbum';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', async (event) => {
                            event.preventDefault();
                            let response = await fetch(`http://localhost:5000/artist?id=${id}`, {
                                method: 'DELETE',
                                headers: {
                                    'Content-Type':'application/json',
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                },
                            });
                            if (response.ok){
                                alert('Removed successfully');
                            } else {
                                alert('Album was not removed');
                            }
                        });
                        document.getElementById('adminPanel').appendChild(removeBtn);
                    }
                } else {
                    alert('not found');
                }
            }
        </script>
    </body>
</html>
