<!DOCTYPE html>

<html>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <h1 id="albumTitle"></h1>
        <a id="albumArtist"></a>
        <div id="trackList"></div>
        <div id="adminPanel" style="display: none;">
            <input id="albumTitleInput" type="text" placeholder="New Title" required style="display: none">
            <button id="updateButton" type="button">Update</button>
            <button id="removeButton" type="button">Remove</button>
            <button id="cancelButton" type="button" style="display: none">Cancel</button>
            <button id="saveButton" type="button" style="display: none">Save</button>
        </div>
        <script src='auth.js'></script>
        <script>
            let params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            function viewMode(){
                document.getElementById('albumTitleInput').style.display = 'none';
                document.getElementById('updateButton').style.display = 'inline-block';
                document.getElementById('removeButton').style.display = 'inline-block';
                document.getElementById('cancelButton').style.display = 'none';
                document.getElementById('saveButton').style.display = 'none';
            }

            function editMode(){
                document.getElementById('albumTitleInput').style.display = 'inline-block';
                document.getElementById('updateButton').style.display = 'none';
                document.getElementById('removeButton').style.display = 'none';
                document.getElementById('cancelButton').style.display = 'inline-block';
                document.getElementById('saveButton').style.display = 'inline-block';
            }

            function createRemoveButtonEvent(){
                document.getElementById('removeButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    let response = await fetch(`album?id=${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (response.ok){
                        alert('Removed successfully');
                    } else {
                        alert('Album was not removed');
                    }
                });
            }

            function createSaveButtonEvent(){
                document.getElementById('saveButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    let newTitle = document.getElementById('albumTitleInput').value;
                    let response = await fetch('album', {
                        method: 'PUT',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({id, title: newTitle})
                    });
                    if (response.ok){
                        alert('Updated successfully');
                        document.getElementById('albumTitle').textContent = newTitle;
                        viewMode();
                    } else {
                        alert('Album was not updated');
                    }
                });
            }

            function createUpdateButtonEvent(){
                document.getElementById('updateButton').addEventListener('click', () => {
                    event.preventDefault();
                    editMode();
                });
            }

            function createCancelButtonEvent(){
                document.getElementById('cancelButton').addEventListener('click', () => {
                    event.preventDefault();
                    viewMode();
                });
            }

            function fillAlbumFields(album){
                document.getElementById('albumTitleInput').value = album.title;
            }

            window.onload = async () => {
                let response = await fetch(`album?id=${id}`)
                if (response.ok){
                    let album = await response.json();
                    document.title = `${album.title} by ${album.artist.name}`;
                    document.getElementById('albumTitle').textContent = album.title;
                    document.getElementById('albumArtist').textContent = album.artist.name;
                    document.getElementById('albumArtist').href = `artist.html?id=${album.artist.id}`;
                    album.tracks.forEach(t => {
                        trackTitle = document.createElement('a');
                        trackTitle.textContent = t.title;
                        trackTitle.href = `track.html?id=${t.id}`;
                        document.getElementById('trackList').appendChild(trackTitle);
                    });
                    let role = getRole();
                    if (role == 'Admin')
                    {
                        createRemoveButtonEvent();
                        createUpdateButtonEvent();
                        createCancelButtonEvent();
                        createSaveButtonEvent();
                        fillAlbumFields(album);
                        document.getElementById('adminPanel').style.display = 'block';
                    }
                }
            }
        </script>
    </body>
</html>
