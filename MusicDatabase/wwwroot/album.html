<!DOCTYPE html>

<html>
    <head>
        <title id="pageTitle">Album:</title>
    </head>
        <h1 id="albumTitle"></h1>
        <a id="albumArtist"></a>
        <div id="trackList"></div>
    <body>
        <script>
            window.onload = async () => {
                let params = new URLSearchParams(window.location.search);
                let id = params.get('id');
                let response = await fetch(`http://localhost:5000/album?id=${id}`)
                if (response.ok){
                    let album = await response.json();
                    document.getElementById('pageTitle').textContent = `${album.title} by ${album.artist.name}`;
                    document.getElementById('albumTitle').textContent = album.title;
                    document.getElementById('albumArtist').textContent = album.artist.name;
                    document.getElementById('albumArtist').href = `http://localhost:5000/artist.html?id=${album.artist.id}`;
                    album.tracks.forEach(t => {
                        trackTitle = document.createElement('a');
                        trackTitle.textContent = t.title;
                        trackTitle.href = `http://localhost:5000/track.html?id=${t.id}`;
                        document.getElementById('trackList').appendChild(trackTitle);
                    });
                    let payload = getPayload();
                    if (payload.role == 'Admin')
                    {
                        let removeBtn = document.createElement('button');
                        removeBtn.id = 'removeAlbum';
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', async (event) => {
                            let response = await fetch(`http://localhost:5000/album?id=${id}`, {
                                method: 'DELETE',
                                headers: {
                                    'Content-Type':'application/json',
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                },
                                body: JSON.stringify(id)
                            });
                            if (response.ok){
                                alert('Removed successfully');
                            } else {
                                alert('Album was not removed');
                            }
                        });
                    }
                }
            }
        </script>
    </body>
</html>
