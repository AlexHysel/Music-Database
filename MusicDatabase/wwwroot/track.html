<!DOCTYPE html>

<html>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <h1 id="trackTitle"></h1>
        <a id="artistName"></a>
        <a id="albumTitle"></a>
        <p id="trackGenre"></p>
        <div id="adminPanel">
            <form id="newTrackInfo" style="display: none">
                <input type="text" placeholder="Title" id="newTitle" required></input><br>
                <input type="text" placeholder="Artist" id="newArtist" required></input><br>
                <input type="text" placeholder="Album" id="newAlbum" required></input><br>
                <div id="otherArtists"></div>
                <button type="button" id="addArtistButton">Add Another Artist</button><br>
                <select id="newGenre" required>
                    <option value="ROCK">ROCK</option>
                    <option value="METAL">METAL</option>
                    <option value="DARKSYNTH">DARKSYNTH</option>
                    <option value="AMBIENT">AMBIENT</option>
                </select><br>
                <input type="submit" value="Save" id="saveButton">
                <input type="button" value="Cancel" id="cancelButton">
            </form>
            <input type="button" value="Update" id="updateButton">
            <input type="button" value="Remove" id="removeButton">
        </div>
        <script src='auth.js'></script>
        <script>
            let params = new URLSearchParams(window.location.search);
            let trackId = params.get('id');
            
            function editMode(){
                document.getElementById('trackTitle').style.display = 'none';
                document.getElementById('artistName').style.display = 'none';
                document.getElementById('albumTitle').style.display = 'none';
                document.getElementById('trackGenre').style.display = 'none';
                
                document.getElementById('newTrackInfo').style.display = 'inline';
                document.getElementById('removeButton').style.display = 'none';
                document.getElementById('updateButton').style.display = 'none';
            }
            
            function viewMode(){
                document.getElementById('trackTitle').style.display = 'inline';
                document.getElementById('artistName').style.display = 'inline';
                document.getElementById('albumTitle').style.display = 'inline';
                document.getElementById('trackGenre').style.display = 'inline';

                document.getElementById('newTrackInfo').style.display = 'none';
                document.getElementById('removeButton').style.display = 'inline';
                document.getElementById('updateButton').style.display = 'inline';
            }

            function createRemoveButtonEvent(trackId){
                document.getElementById('removeButton').addEventListener('click', async (event) => {
                    let response = await fetch(`http://localhost:5000/track?id=${trackId}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(trackId)
                    });
                    if (response.ok){
                        alert('Removed successfully');
                    } else {
                        alert('Track was not removed');
                    }
                });
            }

            function createAddArtistButtonEvent(){
                document.getElementById('addArtistButton').addEventListener('click', () => {
                    let input = document.createElement('input');
                    input.type = 'text';
                    input.required = true;
                    let removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.textContent = 'Remove';
                    removeBtn.id = 'removeArtist';
                    removeBtn.addEventListener('click', (event) =>{
                        event.target.parentElement.remove();
                    })
                    let field = document.createElement('div');
                    field.id = 'field';
                    field.appendChild(input);
                    field.appendChild(removeBtn);
                    let doc = document.getElementById('otherArtists');
                    doc.appendChild(field);
                })
            }

            function createUpdateButtonEvent(){
                document.getElementById('updateButton').addEventListener('click', async (event) => {
                    editMode();
                });
            }

            function createCancelButtonEvent(){
                document.getElementById('cancelButton').addEventListener('click', async (event) => {
                    viewMode();
                });
            }

            function createSaveButtonEvent(trackId){
                document.getElementById('saveButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    let title = document.getElementById('newTitle').value;
                    let artist = document.getElementById('newArtist').value;
                    let album = document.getElementById('newAlbum').value;
                    let genre = document.getElementById('newGenre').value;
                    let others = Array.from(document.getElementById('otherArtists').querySelectorAll('input')).map(input => input.value);

                    let response = await fetch(`http://localhost:5000/track?id=${trackId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({
                            title: title,
                            artistName: artist,
                            albumTitle: album,
                            othersNames: others,
                            genre: genre,
                            id: trackId
                        })
                    });
                    if (response.ok){
                        alert('Updated successfully');
                        window.location.reload();
                    } else {
                        alert('Track was not updated');
                    }
                });
            }

            function fillTrackForm(track){
                document.getElementById('newTitle').value = track.title;
                document.getElementById('newArtist').value = track.artist.name;
                document.getElementById('newAlbum').value = track.album.title;
                document.getElementById('newGenre').value = track.genre;
                let otherArtistsDiv = document.getElementById('otherArtists');
                track.others.forEach(o => {
                    let removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.textContent = 'Remove';
                    removeBtn.id = 'removeArtist';
                    removeBtn.addEventListener('click', (event) =>{
                        event.target.parentElement.remove();
                    });
                    let input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = 'Another Artist';
                    input.value = o.name;
                    let other = document.createElement('div');
                    other.appendChild(input);
                    other.appendChild(removeBtn);
                    otherArtistsDiv.appendChild(other);
                });
            }

            window.onload = async () => {
                let response = await fetch(`http://localhost:5000/track?id=${trackId}`);
                if (response.ok){
                    let track = await response.json();
                    document.title = track.title;
                    document.getElementById('trackTitle').textContent = track.title;
                    document.getElementById('artistName').textContent = track.artist.name;
                    document.getElementById('artistName').href = `http://localhost:5000/artist.html?id=${track.artist.id}`;
                    document.getElementById('albumTitle').textContent = track.album.title;
                    document.getElementById('albumTitle').href = `http://localhost:5000/album.html?id=${track.album.id}`;
                    document.getElementById('trackGenre').textContent = track.genre;

                    let payload = getPayload();
                    if (payload.role == 'Admin')
                    {
                        createCancelButtonEvent();
                        createAddArtistButtonEvent();
                        createRemoveButtonEvent(trackId);
                        createSaveButtonEvent(trackId);
                        createUpdateButtonEvent();
                        fillTrackForm(track);
                        viewMode();
                    }
                }
                else alert('Track not found');
            }
        </script>
    </body>
</html>
