<!DOCTYPE html>

<html>
    <head>
        <title>Search</title>
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <div id='search' class="input-group mb-3">
            <input id='searchLine' type='text' class='form-control'>
            <input id='searchButton' class='btn btn-outline-secondary' type='submit'>
        </div>
        <div id='foundArtists'></div>
        <div id='foundAlbums'></div>
        <div id='foundTracks'></div>
        <div>
            <h2>Users</h2>
            <ul id='foundUsers'></ul>
        </div>
        <script src="trackElement.js"></script>
        <script src="albumElement.js"></script>
        <script src="artistElement.js"></script>
        <script>
            document.getElementById('searchButton').addEventListener('click', async (event) => {
                event.preventDefault();
                let searchLine = document.getElementById('searchLine').value;
                let response = await fetch(`search?searchLine=${searchLine}`);
                if (response.ok){
                    let result = await response.json();

                    let artistsEl = document.getElementById('foundArtists');
                    artistsEl.innerHTML = '';
                    artistsEl.appendChild(createArtistList(result.artists));

                    let albumsEl = document.getElementById('foundAlbums');
                    albumsEl.innerHTML = '';
                    albumsEl.appendChild(createAlbumList(result.albums));

                    let tracksEl = document.getElementById('foundTracks');
                    tracksEl.innerHTML = '';
                    tracksEl.appendChild(createTrackList(result.tracks));

                    document.getElementById('foundUsers').innerHTML = '';
                    for (user of result.users){
                        let userName = document.createElement('a');
                        userName.textContent = user.name;
                        userName.href = `user.html?id=${user.id}`
                        document.getElementById('foundUsers').appendChild(userName);
                    }
                } else {
                    alert("Something went wrong :(")
                }
            });
        </script>
    </body>
</html>
