<!DOCTYPE html>

<html>
    <head>
        <title>Search</title>
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <div id='search' class="input-group mb-3">
            <input id='searchLine' type='text' class='form-control'>
            <input id='searchButton' class='btn btn-outline-secondary' type='submit'>
        </div>
        <div>
            <h2>Artists</h2>
            <ul class="artistList" id='foundArtists'></ul>
        </div>
        <div>
            <h2>Albums</h2>
            <ul class="albumList" id='foundAlbums'></ul>
        </div>
        <div>
            <h2>Tracks</h2>
            <ul id='foundTracks'></ul>
        </div>
        <div>
            <h2>Users</h2>
            <ul id='foundUsers'></ul>
        </div>
        <script src="trackElement.js"></script>
        <script src="albumElement.js"></script>
        <script src="artistElement.js"></script>
        <script>
            document.getElementById('searchButton').addEventListener('click', async (event) => {
                event.preventDefault();
                let searchLine = document.getElementById('searchLine').value;
                let response = await fetch(`search?searchLine=${searchLine}`);
                if (response.ok){
                    let result = await response.json();
                    document.getElementById('foundArtists').innerHTML = '';
                    for (artist of result.artists){
                        document.getElementById('foundArtists').appendChild(createArtistElement(artist));
                    }
                    document.getElementById('foundAlbums').innerHTML = '';
                    for (album of result.albums){
                        document.getElementById('foundAlbums').appendChild(createAlbumElement(album));
                    }
                    document.getElementById('foundTracks').innerHTML = '';
                    for (track of result.tracks){
                        document.getElementById('foundTracks').appendChild(createTrackElement(track));
                    }
                    document.getElementById('foundUsers').innerHTML = '';
                    for (user of result.users){
                        let userName = document.createElement('a');
                        userName.textContent = user.name;
                        userName.href = `user.html?id=${user.id}`
                        document.getElementById('foundUsers').appendChild(userName);
                    }
                } else {
                    alert("Something went wrong :(")
                }
            });
        </script>
    </body>
</html>
