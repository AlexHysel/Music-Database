<!DOCTYPE html>

<html>
    <head>
        <title>Search</title>
        <meta charset="utf-8">
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <div id='search' class="input-group mb-3">
            <input id='searchLine' type='text' class='form-control'>
            <input id='searchButton' class='btn btn-outline-secondary' type='submit'>
        </div>
        <div id='foundArtists'></div>
        <div id='foundAlbums'></div>
        <div id='foundTracks'></div>
        <script src="auth.js"></script>
        <script src="trackElement.js"></script>
        <script src="albumElement.js"></script>
        <script src="artistElement.js"></script>
        <script>
            async function search()
            {
                let searchLine = document.getElementById('searchLine').value;
                let response = await fetch(`search?searchLine=${searchLine}`);
                if (response.ok){
                    const result = await readJsonOrDefault(response, { artists: [], albums: [], tracks: [] });
                    const safeResult = result && typeof result === 'object'
                        ? result
                        : { artists: [], albums: [], tracks: [] };

                    const artistsEl = document.getElementById('foundArtists');
                    artistsEl.innerHTML = '';
                    const artistItems = Array.isArray(safeResult.artists) ? safeResult.artists : getPagedItems(safeResult.artists, []);
                    const artistsList = createArtistListWithMore(artistItems, { endpoint: 'artist/search', queryParam: 'name' });
                    artistsEl.appendChild(artistsList);

                    const albumsEl = document.getElementById('foundAlbums');
                    albumsEl.innerHTML = '';
                    const albumItems = Array.isArray(safeResult.albums) ? safeResult.albums : getPagedItems(safeResult.albums, []);
                    const albumsList = createAlbumListWithMore(albumItems, { endpoint: 'album/search', queryParam: 'title' });
                    albumsEl.appendChild(albumsList);

                    const tracksEl = document.getElementById('foundTracks');
                    tracksEl.innerHTML = '';
                    const trackItems = Array.isArray(safeResult.tracks) ? safeResult.tracks : getPagedItems(safeResult.tracks, []);
                    tracksEl.appendChild(createTrackList(trackItems, { endpoint: 'track/search', queryParam: 'title', compact: true }));

                    const hasAnyResults = (artistItems.length > 0) || (albumItems.length > 0) || (trackItems.length > 0);
                    if (!hasAnyResults) {
                        const emptyNotice = document.createElement('p');
                        emptyNotice.className = 'text-muted mt-2';
                        emptyNotice.textContent = 'No results found.';
                        tracksEl.appendChild(emptyNotice);
                    }
                } else {
                    alert(await readErrorMessage(response, 'Something went wrong :('));
                }
            }

            document.getElementById('searchButton').addEventListener('click', async (event) => {
                event.preventDefault();
                search();
            });

            search();
        </script>
    </body>
</html>
