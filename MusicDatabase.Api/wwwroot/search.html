<!DOCTYPE html>

<html>
    <head>
        <title>Search</title>
        <meta charset="utf-8">
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <div id='search' class="input-group mb-3">
            <input id='searchLine' type='text' class='form-control'>
            <input id='searchButton' class='btn btn-outline-secondary' type='submit'>
        </div>
        <div id='foundArtists'></div>
        <div id='foundAlbums'></div>
        <div id='foundTracks'></div>
        <div>
            <h2>Users</h2>
            <ul id='foundUsers'></ul>
        </div>
        <script src="auth.js"></script>
        <script src="trackElement.js"></script>
        <script src="albumElement.js"></script>
        <script src="artistElement.js"></script>
        <script>
            async function search()
            {
                let searchLine = document.getElementById('searchLine').value;
                let response = await fetch(`search?searchLine=${searchLine}`);
                if (response.ok){
                    let result = await response.json();

                    let artistsEl = document.getElementById('foundArtists');
                    artistsEl.innerHTML = '';
                    let artistsList = createArtistListWithMore(result.artists, { endpoint: 'artist/search', queryParam: 'name' });
                    artistsEl.appendChild(artistsList);

                    let albumsEl = document.getElementById('foundAlbums');
                    albumsEl.innerHTML = '';
                    let albumsList = createAlbumListWithMore(result.albums, { endpoint: 'album/search', queryParam: 'title' });
                    albumsEl.appendChild(albumsList);

                    let tracksEl = document.getElementById('foundTracks');
                    tracksEl.innerHTML = '';
                    tracksEl.appendChild(createTrackList(result.tracks, { endpoint: 'track/search', queryParam: 'title', compact: true }));

                    let usersEl = document.getElementById('foundUsers');
                    usersEl.innerHTML = '';
                    let users = Array.isArray(result.users) ? result.users : getPagedItems(result.users, []);
                    for (let user of users){
                        let userName = document.createElement('a');
                        userName.textContent = user.name;
                        userName.href = `user.html?id=${user.id}`;
                        usersEl.appendChild(userName);
                    }
                } else {
                    alert("Something went wrong :(");
                }
            }

            document.getElementById('searchButton').addEventListener('click', async (event) => {
                event.preventDefault();
                search();
            });

            search();
        </script>
    </body>
</html>
