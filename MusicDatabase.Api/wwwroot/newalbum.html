<!DOCTYPE html>

<html>
    <head>
        <title>Add Album</title>
        <meta charset="utf-8">
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">

        <div class="container py-4">
            <div class="card p-4 album-create-card">
                <h2 class="mb-4">Add New Album</h2>

                <form id="albumForm">
                    <div class="album-create-layout">
                        <div class="album-cover-panel">
                            <label class="form-label">Cover URL</label>
                            <input id="imageUrl" class="form-control mb-3" type="url" placeholder="https://..." required>
                            <div class="cover-preview-frame">
                                <img id="coverPreview" alt="Album cover preview" src="">
                            </div>
                        </div>

                        <div class="album-form-panel">
                            <div class="mb-3">
                                <label class="form-label">Album Title</label>
                                <input id="albumTitle" class="form-control" type="text" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Artist</label>
                                <input id="artistName" class="form-control" type="text" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Release Year</label>
                                <input id="releaseYear" class="form-control" type="number" min="1900" max="2100" required>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="mb-0">Tracks</h3>
                        </div>
                        <div id="tracksContainer"></div>
                        <div class="mt-3 d-flex justify-content-end">
                            <button type="button" id="addTrack" class="btn btn-sm btn-outline-light">Add Track</button>
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end">
                        <button type="submit" class="btn btn-success">Create Album</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="auth.js"></script>
        <script>
            const tracksContainer = document.getElementById('tracksContainer');
            const imageUrlInput = document.getElementById('imageUrl');
            const coverPreview = document.getElementById('coverPreview');

            function addAnotherArtist(container) {
                const row = document.createElement('div');
                row.className = 'album-other-row';

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control';
                input.placeholder = 'Featured artist';

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn btn-sm btn-outline-light';
                removeBtn.textContent = 'Remove';
                removeBtn.addEventListener('click', () => row.remove());

                row.appendChild(input);
                row.appendChild(removeBtn);
                container.appendChild(row);
            }

            function syncTrackOrderLabels() {
                Array.from(tracksContainer.children).forEach((card, index) => {
                    const label = card.querySelector('.track-order-label');
                    if (label) label.textContent = `Track ${index + 1}`;
                });
            }

            function moveTrack(card, direction) {
                const cards = Array.from(tracksContainer.children);
                const index = cards.indexOf(card);
                const targetIndex = index + direction;

                if (targetIndex < 0 || targetIndex >= cards.length) return;

                const targetCard = cards[targetIndex];
                tracksContainer.insertBefore(card, direction < 0 ? targetCard : targetCard.nextSibling);
                syncTrackOrderLabels();
            }

            function createTrackField() {
                const trackCard = document.createElement('div');
                trackCard.className = 'album-track-card';

                const header = document.createElement('div');
                header.className = 'track-card-header';

                const title = document.createElement('strong');
                title.className = 'track-order-label';
                title.textContent = `Track ${tracksContainer.children.length + 1}`;

                const actionGroup = document.createElement('div');
                actionGroup.className = 'track-card-actions';

                const moveUpBtn = document.createElement('button');
                moveUpBtn.type = 'button';
                moveUpBtn.className = 'btn btn-sm btn-outline-light';
                moveUpBtn.textContent = '↑';
                moveUpBtn.title = 'Move up';
                moveUpBtn.addEventListener('click', () => moveTrack(trackCard, -1));

                const moveDownBtn = document.createElement('button');
                moveDownBtn.type = 'button';
                moveDownBtn.className = 'btn btn-sm btn-outline-light';
                moveDownBtn.textContent = '↓';
                moveDownBtn.title = 'Move down';
                moveDownBtn.addEventListener('click', () => moveTrack(trackCard, 1));

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn btn-sm btn-outline-light';
                removeBtn.textContent = 'Remove';
                removeBtn.addEventListener('click', () => {
                    trackCard.remove();
                    syncTrackOrderLabels();
                });

                actionGroup.appendChild(moveUpBtn);
                actionGroup.appendChild(moveDownBtn);
                actionGroup.appendChild(removeBtn);
                header.appendChild(title);
                header.appendChild(actionGroup);

                const trackTitleWrap = document.createElement('div');
                trackTitleWrap.className = 'mb-2';
                const trackTitleLabel = document.createElement('label');
                trackTitleLabel.className = 'form-label';
                trackTitleLabel.textContent = 'Title';
                const trackTitle = document.createElement('input');
                trackTitle.className = 'form-control';
                trackTitle.type = 'text';
                trackTitle.required = true;
                trackTitleWrap.appendChild(trackTitleLabel);
                trackTitleWrap.appendChild(trackTitle);

                const genreWrap = document.createElement('div');
                genreWrap.className = 'mb-2';
                const genreLabel = document.createElement('label');
                genreLabel.className = 'form-label';
                genreLabel.textContent = 'Genre';
                const genreSelect = document.createElement('select');
                genreSelect.className = 'form-select';
                genreSelect.required = true;
                genreSelect.innerHTML = `
                    <option value="Rock">Rock</option>
                    <option value="Metal">Metal</option>
                    <option value="Darksynth">Darksynth</option>
                    <option value="Ambient">Ambient</option>
                `;
                genreWrap.appendChild(genreLabel);
                genreWrap.appendChild(genreSelect);

                const othersWrap = document.createElement('div');
                othersWrap.className = 'mb-2';
                const othersHeader = document.createElement('div');
                othersHeader.className = 'd-flex justify-content-between align-items-center mb-2';
                const othersTitle = document.createElement('span');
                othersTitle.textContent = 'Featured artists';
                const addArtistBtn = document.createElement('button');
                addArtistBtn.type = 'button';
                addArtistBtn.className = 'btn btn-sm btn-outline-light';
                addArtistBtn.textContent = 'Add artist';
                addArtistBtn.addEventListener('click', () => addAnotherArtist(othersList));

                const othersList = document.createElement('div');
                othersList.className = 'album-others-list';

                othersHeader.appendChild(othersTitle);
                othersHeader.appendChild(addArtistBtn);
                othersWrap.appendChild(othersHeader);
                othersWrap.appendChild(othersList);

                trackCard.appendChild(header);
                trackCard.appendChild(trackTitleWrap);
                trackCard.appendChild(genreWrap);
                trackCard.appendChild(othersWrap);
                tracksContainer.appendChild(trackCard);

                return { trackTitle, genreSelect, othersList };
            }

            function updateCoverPreview() {
                const value = imageUrlInput.value.trim();
                if (!value) {
                    coverPreview.removeAttribute('src');
                    coverPreview.style.opacity = '0.2';
                    return;
                }

                coverPreview.src = value;
                coverPreview.style.opacity = '1';
            }

            imageUrlInput.addEventListener('input', updateCoverPreview);

            document.getElementById('addTrack').addEventListener('click', () => {
                createTrackField();
            });

            document.getElementById('albumForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                const title = document.getElementById('albumTitle').value.trim();
                const artistName = document.getElementById('artistName').value.trim();
                const imageUrl = imageUrlInput.value.trim();
                const releaseYear = Number(document.getElementById('releaseYear').value);

                const trackCards = Array.from(tracksContainer.children);
                const tracks = trackCards.map((card) => {
                    const inputs = card.querySelectorAll('input[type="text"]');
                    const titleInput = inputs[0];
                    const genreSelect = card.querySelector('select');
                    const otherArtists = Array.from(card.querySelectorAll('.album-other-row input'))
                        .map(input => input.value.trim())
                        .filter(Boolean);

                    return {
                        title: titleInput.value.trim(),
                        genre: genreSelect.value,
                        others: otherArtists
                    };
                }).filter(track => track.title && track.genre);

                const response = await fetch('album', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        title,
                        artistName,
                        imageUrl,
                        releaseYear,
                        tracks
                    })
                });

                if (response.ok) {
                    alert('Album created successfully!');
                    window.location.href = '/';
                } else {
                    const text = await response.text();
                    alert(`Failed to create album: ${text || 'Please try again.'}`);
                }
            });

            createTrackField();
            updateCoverPreview();
        </script>
    </body>
</html>
