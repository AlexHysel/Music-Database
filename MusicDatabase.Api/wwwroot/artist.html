<!DOCTYPE html>

<html>
    <head>
        <title>Artist</title>
        <meta charset="utf-8">
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <div class="container py-4">
        <div id="artist" class="artistBig">
            <div class="left artist-hero-wrap">
                <div class="artist-hero">
                    <img id="artistImage">
                    <div class="artist-hero-overlay">
                        <h1 id="artistName"></h1>
                        <div id="artistMeta" class="detail-meta" style="display: none;"></div>
                    </div>
                </div>
            </div>
            <div class="artistBigInfo">
                <div id="adminPanel" style="display: none">
                    <input type="text" id="newName" class="form-control mb-2" placeholder="Artist's Name" required style="display: none">
                    <input type="text" id="newImageUrl" class="form-control mb-2" placeholder="Artist's Image URL" required style="display: none">
                    <div class="d-flex gap-2">
                        <button type="button" id="removeButton" class="btn btn-sm btn-danger">Remove</button>
                        <button type="button" id="updateButton" class="btn btn-sm btn-outline-light">Update</button>
                        <button type="button" id="saveButton" class="btn btn-sm btn-success" style="display: none">Save</button>
                        <button type="button" id="cancelButton" class="btn btn-sm btn-secondary" style="display: none">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="albumList"></div>
        <div id="trackList"></div>
        <div id="appearsOnSection" style="display: none; margin-top: 20px;">
            <h2>Appears On</h2>
            <div id="appearsOnList"></div>
        </div>
        <script src='auth.js'></script>
        <script src='albumElement.js'></script>
        <script src="trackElement.js"></script>
        <script>
            let params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            function editMode(){
                document.getElementById('newName').style.display = 'inline';
                document.getElementById('newImageUrl').style.display = 'inline';
                document.getElementById('updateButton').style.display = 'none';
                document.getElementById('removeButton').style.display = 'none';
                document.getElementById('cancelButton').style.display = 'inline';
                document.getElementById('saveButton').style.display = 'inline';
            }

            function viewMode(){
                document.getElementById('newName').style.display = 'none';
                document.getElementById('newImageUrl').style.display = 'none';
                document.getElementById('updateButton').style.display = 'inline';
                document.getElementById('removeButton').style.display = 'inline';
                document.getElementById('cancelButton').style.display = 'none';
                document.getElementById('saveButton').style.display = 'none';
            }

            function createRemoveButtonEvent(){
                document.getElementById('removeButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    let response = await fetch(`artist?id=${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                    });
                    if (response.ok){
                        alert('Removed successfully');
                        window.location.href = '/';
                    } else {
                        alert('Artist was not removed');
                    }
                });
            }

            function createSaveButtonEvent(){
                document.getElementById('saveButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    let name = document.getElementById('newName').value;
                    let imageUrl = document.getElementById('newImageUrl').value;
                    let body = { Name: name, ImageUrl: imageUrl, Id: id };
                    let response = await fetch('artist', {
                        method: 'PUT',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(body)
                    });
                    if (response.ok)
                    {
                        alert('Updated')
                        window.location.reload();
                    }
                    else{
                        alert('Artist not found');
                    }
                });
            }

            function createCancelButtonEvent(){
                document.getElementById('cancelButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    viewMode();
                });
            }

            function createUpdateButtonEvent(){
                document.getElementById('updateButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    editMode();
                });
            }

            function fillArtistForm(artist){
                document.getElementById('newName').value = artist.name;
                document.getElementById('newImageUrl').value = artist.imageUrl ?? '';
            }

            function renderDetailMeta(containerId, createdAt, updatedAt) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const entries = [];
                if (createdAt) entries.push(`Created: ${new Date(createdAt).toLocaleDateString()}`);
                if (updatedAt) entries.push(`Updated: ${new Date(updatedAt).toLocaleDateString()}`);

                if (!entries.length) {
                    container.style.display = 'none';
                    return;
                }

                container.innerHTML = entries.map(value => `<span>${value}</span>`).join(' • ');
                container.style.display = 'block';
            }

            async function loadArtistTracks() {
                let response = await fetch(`artist/tracks?id=${id}&toSkip=0&toTake=5`);
                if (!response.ok) {
                    document.getElementById('trackList').innerHTML = '';
                    return;
                }

                let pagedTracks = await response.json();
                let tracksList = createTrackList(pagedTracks, { endpoint: 'artist/tracks', artistId: id, compact: true });
                document.getElementById('trackList').innerHTML = '';
                document.getElementById('trackList').appendChild(tracksList);
            }

            window.onload = async () => {
                let response = await fetch(`artist?id=${id}`);
                if (response.ok){
                    let artist = await response.json();
                    document.getElementById('artistImage').src = artist.imageUrl;
                    document.getElementById('artistName').textContent = artist.name;
                    renderDetailMeta('artistMeta', artist.createdAt, artist.updatedAt);
                    document.title = artist.name;
                    // On artist page we want paged lists for albums and tracks
                    let albumsList = createAlbumListWithMore(artist.albums, { endpoint: `album/search`, queryParam: 'title' });
                    document.getElementById('albumList').append(albumsList);
                    if (albumsList._moreElement) document.getElementById('albumList').append(albumsList._moreElement);

                    let appearsOn = Array.isArray(artist.appearsOn) ? artist.appearsOn : [];
                    if (appearsOn.length > 0) {
                        let appearsOnList = createTrackList({ items: appearsOn, hasMore: false }, { compact: true, showMore: false });
                        document.getElementById('appearsOnList').appendChild(appearsOnList);
                        document.getElementById('appearsOnSection').style.display = 'block';
                    }

                    await loadArtistTracks();
                    let role = getRole();
                    if (role == 'Admin'){
                        createRemoveButtonEvent();
                        createCancelButtonEvent();
                        createSaveButtonEvent();
                        createUpdateButtonEvent();
                        fillArtistForm(artist);
                        document.getElementById('adminPanel').style.display = 'block';
                    }
                } else {
                    alert('not found');
                }
            }
        </script>
    </body>
</html>
