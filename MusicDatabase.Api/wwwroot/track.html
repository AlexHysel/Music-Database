<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <title>Track</title>
    </head>
    <body>
        <div id="track" class="trackBig">
            <img id="cover">
            <div class="trackBigInfo">
                <h1 id="trackTitle"></h1>
                <a id="artistName"></a>
                <a id="albumTitle"></a>
                <div id="trackMeta" class="detail-meta" style="display: none;"></div>
                <section id="tagsSection" class="community-tags" aria-labelledby="tagsHeading">
                    <div class="community-tags-header">
                        <h2 id="tagsHeading">Community tags</h2>
                        <button type="button" class="tag-add-button" id="addTagButton"
                            aria-expanded="false" aria-controls="newTagForm" hidden>
                            <span aria-hidden="true">+</span> Add tag
                        </button>
                    </div>
                    <p class="tag-help">The community’s top tags for this track.</p>
                    <ul id="trackTags" class="tag-list" aria-label="Track tags"></ul>
                    <p id="emptyTags" class="tag-empty" hidden>No tags yet. Help describe this track.</p>
                    <p id="tagLoginHint" class="tag-help" hidden><a href="login.html">Sign in</a> to add your tags.</p>
                    <form id="newTagForm" class="tag-form" hidden novalidate>
                        <label for="newTagInput">Describe the sound</label>
                        <p id="tagInputHint" class="tag-help">Add a tag or support an existing one. One tag at a time.</p>
                        <div class="tag-input-wrap">
                            <span class="tag-input-prefix" aria-hidden="true">#</span>
                            <input type="text" id="newTagInput" name="tag" class="tag-input"
                                placeholder="e.g. dream pop" maxlength="20" autocomplete="off"
                                aria-describedby="tagInputHint tagCounter tagError">
                            <span id="tagCounter" class="tag-counter">0 / 20</span>
                        </div>
                        <p id="tagError" class="tag-error" role="alert" hidden></p>
                        <div class="tag-form-actions">
                            <button type="button" class="tag-cancel-button" id="cancelTagButton">Cancel</button>
                            <button type="submit" class="tag-submit-button" id="submitTagButton" disabled>Add tag</button>
                        </div>
                    </form>
                    <p id="tagStatus" class="tag-status" role="status" aria-live="polite" hidden></p>
                </section>
                <div id="adminPanel" style="display: none">
                    <form id="newTrackInfo" style="display: none" class="mt-3">
                        <div class="mb-2">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" placeholder="Title" id="newTitle" required>
                        </div>
                        <div class="mb-2">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label mb-0">Featured Artists</label>
                                <button type="button" id="addArtistButton" class="btn btn-sm btn-outline-light">Add Artist</button>
                            </div>
                            <div id="otherArtists"></div>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-success btn-sm" id="saveButton">Save</button>
                            <button type="button" class="btn btn-secondary btn-sm" id="cancelButton">Cancel</button>
                        </div>
                    </form>
                    <div class="d-flex gap-2 mt-3">
                        <button type="button" class="btn btn-outline-light btn-sm" id="updateButton">Update</button>
                        <button type="button" class="btn btn-danger btn-sm" id="removeButton">Remove</button>
                    </div>
                </div>
            </div>
        </div>
        <script src='auth.js'></script>
        <script src='tags.js'></script>
        <script>
            let params = new URLSearchParams(window.location.search);
            let trackId = params.get('id');

            function editMode(){
                document.getElementById('trackTitle').style.display = 'none';
                document.getElementById('artistName').style.display = 'none';
                document.getElementById('albumTitle').style.display = 'none';
                
                document.getElementById('newTrackInfo').style.display = 'inline';
                document.getElementById('removeButton').style.display = 'none';
                document.getElementById('updateButton').style.display = 'none';
            }
            
            function viewMode(){
                document.getElementById('trackTitle').style.display = 'inline';
                document.getElementById('artistName').style.display = 'inline';
                document.getElementById('albumTitle').style.display = 'inline';

                document.getElementById('newTrackInfo').style.display = 'none';
                document.getElementById('removeButton').style.display = 'inline';
                document.getElementById('updateButton').style.display = 'inline';
            }

            function createRemoveButtonEvent(trackId){
                document.getElementById('removeButton').addEventListener('click', async (event) => {
                    let response = await fetch(`track?id=${trackId}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(trackId)
                    });
                    if (response.ok){
                        alert('Removed successfully');
                    } else {
                        alert('Track was not removed');
                    }
                });
            }

            function bindRemoveArtistField(button) {
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const row = button.closest('.artist-row');
                    if (row) {
                        row.remove();
                    }
                });
            }

            function addArtistField(value = '') {
                const container = document.getElementById('otherArtists');
                const row = document.createElement('div');
                row.className = 'artist-row d-flex gap-2 mb-2';

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control';
                input.placeholder = 'Featured artist';
                input.required = true;
                input.value = value;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn btn-sm btn-outline-light';
                removeBtn.textContent = 'Remove';
                bindRemoveArtistField(removeBtn);

                row.appendChild(input);
                row.appendChild(removeBtn);
                container.appendChild(row);
            }

            function createAddArtistButtonEvent(){
                document.getElementById('addArtistButton').addEventListener('click', () => {
                    addArtistField('');
                });
            }

            function createUpdateButtonEvent(){
                document.getElementById('updateButton').addEventListener('click', async (event) => {
                    editMode();
                });
            }

            function createCancelButtonEvent(){
                document.getElementById('cancelButton').addEventListener('click', async (event) => {
                    viewMode();
                });
            }

            function createSaveButtonEvent(trackId){
                document.getElementById('newTrackInfo').addEventListener('submit', async (event) => {
                    event.preventDefault();
                    let title = document.getElementById('newTitle').value.trim();
                    let others = Array.from(document.getElementById('otherArtists').querySelectorAll('input'))
                        .map(input => input.value.trim())
                        .filter(Boolean)
                        .filter((name, index, all) => all.findIndex(value => value.toLowerCase() === name.toLowerCase()) === index);
                    
                    let response = await fetch(`track?id=${trackId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({
                            title,
                            numberInTheAlbum: 0,
                            others,
                            id: trackId
                        })
                    });
                    if (response.ok){
                        alert('Updated successfully');
                        window.location.reload();
                    } else {
                        alert('Track was not updated');
                    }
                });
            }

            function fillTrackForm(track){
                document.getElementById('newTitle').value = track.title;
                const otherArtistsDiv = document.getElementById('otherArtists');
                otherArtistsDiv.innerHTML = '';
                (track.others || []).forEach(o => {
                    addArtistField(o.name || o);
                });
            }

            function renderDetailMeta(containerId, createdAt, updatedAt) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const entries = [];
                if (createdAt) entries.push(`Created: ${new Date(createdAt).toLocaleDateString()}`);
                if (updatedAt) entries.push(`Updated: ${new Date(updatedAt).toLocaleDateString()}`);

                if (!entries.length) {
                    container.style.display = 'none';
                    return;
                }

                container.innerHTML = entries.map(value => `<span>${value}</span>`).join(' • ');
                container.style.display = 'block';
            }

            window.onload = async () => {
                let response = await fetch(`track?id=${trackId}`);
                if (response.ok){
                    let track = await response.json();
                    document.title = track.title;
                    document.getElementById('trackTitle').textContent = track.title;
                    document.getElementById('artistName').textContent = track.artistName;
                    document.getElementById('artistName').href = `artist.html?id=${track.artistId}`;
                    document.getElementById('albumTitle').textContent = track.albumTitle;
                    document.getElementById('albumTitle').href = `album.html?id=${track.albumId}`;
                    document.getElementById('cover').src = track.albumImageUrl;
                    initializeTags('track', track.id, track.tags);
                    renderDetailMeta('trackMeta', track.createdAt, track.updatedAt);

                    let role = getRole();
                    if (role == 'Admin')
                    {
                        createCancelButtonEvent();
                        createAddArtistButtonEvent();
                        createRemoveButtonEvent(trackId);
                        createSaveButtonEvent(trackId);
                        createUpdateButtonEvent();
                        fillTrackForm(track);
                        viewMode();
                        document.getElementById('adminPanel').style.display = 'block';
                    }
                }
                else alert('Track not found');
            }
        </script>
    </body>
</html>
