<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <title>Album</title>
    </head>
    <body>
        <div class="container py-4">
        <div id="album" class="albumBig">
            <div class="left">
                <img id="cover">
                <h1 id="albumTitle"></h1>
                <a id="albumArtist"></a>
                <section id="tagsSection" class="community-tags" aria-labelledby="tagsHeading">
                    <div class="community-tags-header">
                        <h2 id="tagsHeading">Community tags</h2>
                        <button type="button" class="tag-add-button" id="addTagButton"
                            aria-expanded="false" aria-controls="newTagForm" hidden>
                            <span aria-hidden="true">+</span> Add tag
                        </button>
                    </div>
                    <p class="tag-help">The community’s top tags for this album.</p>
                    <ul id="albumTags" class="tag-list" aria-label="Album tags"></ul>
                    <p id="emptyTags" class="tag-empty" hidden>No tags yet. Help describe this album.</p>
                    <p id="tagLoginHint" class="tag-help" hidden><a href="login.html">Sign in</a> to add your tags.</p>
                    <form id="newTagForm" class="tag-form" hidden novalidate>
                        <label for="newTagInput">Describe the sound</label>
                        <p id="tagInputHint" class="tag-help">Add a tag or support an existing one. One tag at a time.</p>
                        <div class="tag-input-wrap">
                            <span class="tag-input-prefix" aria-hidden="true">#</span>
                            <input type="text" id="newTagInput" name="tag" class="tag-input"
                                placeholder="e.g. dream pop" maxlength="20" autocomplete="off"
                                aria-describedby="tagInputHint tagCounter tagError">
                            <span id="tagCounter" class="tag-counter">0 / 20</span>
                        </div>
                        <p id="tagError" class="tag-error" role="alert" hidden></p>
                        <div class="tag-form-actions">
                            <button type="button" class="tag-cancel-button" id="cancelTagButton">Cancel</button>
                            <button type="submit" class="tag-submit-button" id="submitTagButton" disabled>Add tag</button>
                        </div>
                    </form>
                    <p id="tagStatus" class="tag-status" role="status" aria-live="polite" hidden></p>
                </section>
                <div id="albumMeta" class="detail-meta" style="display: none;"></div>
                <div id="adminPanel" style="display: none;">
                    <div class="d-flex gap-2">
                        <button id="updateButton" type="button" class="btn btn-sm btn-outline-light">Update</button>
                        <button id="removeButton" type="button" class="btn btn-sm btn-danger">Remove</button>
                    </div>
                </div>
            </div>
            <div id="trackList"></div>
        </div>
        </div>
        <script src='auth.js'></script>
        <script src='trackElement.js'></script>
        <script src='tags.js'></script>
        <script>
            let params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            function createRemoveButtonEvent(){
                document.getElementById('removeButton').addEventListener('click', async (event) => {
                    event.preventDefault();
                    let response = await fetch(`album?id=${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type':'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (response.ok){
                        alert('Removed successfully');
                        window.location.href = '/';
                    } else {
                        alert('Album was not removed');
                    }
                });
            }

            function createUpdateButtonEvent(){
                document.getElementById('updateButton').addEventListener('click', (event) => {
                    event.preventDefault();
                    window.location.href = `editalbum.html?id=${id}`;
                });
            }

            function fillAlbumFields(album){
                document.getElementById('albumTitleInput').value = album.title;
                document.getElementById('newImageUrl').value = album.imageUrl;
            }

            function renderDetailMeta(containerId, createdAt, updatedAt) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const entries = [];
                if (createdAt) entries.push(`Created: ${new Date(createdAt).toLocaleDateString()}`);
                if (updatedAt) entries.push(`Updated: ${new Date(updatedAt).toLocaleDateString()}`);

                if (!entries.length) {
                    container.style.display = 'none';
                    return;
                }

                container.innerHTML = entries.map(value => `<span>${value}</span>`).join(' • ');
                container.style.display = 'block';
            }

            window.onload = async () => {
                let response = await fetch(`album?id=${id}`)
                if (response.ok){
                    let album = await response.json();
                    document.title = `${album.title} by ${album.artistName}`;
                    document.getElementById('cover').src = album.imageUrl;
                    document.getElementById('albumTitle').textContent = album.title;
                    document.getElementById('albumArtist').textContent = album.artistName;
                    document.getElementById('albumArtist').href = `artist.html?id=${album.artistId}`;
                    initializeTags('album', album.id, album.tags);
                    renderDetailMeta('albumMeta', album.createdAt, album.updatedAt);
                    document.getElementById('trackList').appendChild(createTrackList(album.tracks, { showMore: false, compact: true }));
                    let role = getRole();
                    if (role == 'Admin')
                    {
                        createRemoveButtonEvent();
                        createUpdateButtonEvent();
                        document.getElementById('adminPanel').style.display = 'block';
                    }
                }
            }
        </script>
    </body>
</html>
