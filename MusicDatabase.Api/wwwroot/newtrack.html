<!DOCTYPE html>

<html>
    <head>
        <title>Add New Track</title>
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styling/main.css">
        <div class="container py-4">
            <div class="card p-4" style="max-width:720px;margin:auto;">
                <h2 class="mb-3">Add New Track</h2>
                <script src='auth.js'></script>
                <div id="username" class="mb-2 text-muted"></div>
                <script>
                    if (getUsername()){
                        document.getElementById('username').textContent = `Signed in as ${getUsername()}`;
                    }
                </script>
                <form id="trackInfo">
                    <div class="mb-2">
                        <label class="form-label">Track Title</label>
                        <input class="form-control" type="text" id="trackTitle" name="Title" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Album Title</label>
                        <input class="form-control" type="text" id="albumTitle" name="Album" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Artist</label>
                        <input class="form-control" type="text" id="artist" name="Artist" required>
                    </div>
                    <div id="otherArtists" class="mb-2"></div>
                    <button type="button" id="addArtist" class="btn btn-sm btn-outline-light mb-3">Add Another Artist</button>
                    <div class="mb-3">
                        <label class="form-label">Genre</label>
                        <select id="genre" name="Genre" class="form-select" required>
                            <option value="Rock">Rock</option>
                            <option value="Metal">Metal</option>
                            <option value="Darksynth">Darksynth</option>
                            <option value="Ambient">Ambient</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn btn-success">Add Track</button>
                    </div>
                </form>
            </div>
        </div>
        <script>
            document.getElementById('addArtist').addEventListener('click', () => {
                let input = document.createElement('input');
                input.type = 'text';
                input.required = true;
                let removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.textContent = 'Remove';
                removeBtn.id = 'removeArtist';
                removeBtn.addEventListener('click', (event) =>{
                    event.target.parentElement.remove();
                })
                let field = document.createElement('div');
                field.id = 'field';
                field.appendChild(input);
                field.appendChild(removeBtn);
                let doc = document.getElementById('otherArtists');
                doc.appendChild(field);
            })
            document.getElementById('trackInfo').addEventListener('submit', async (event) => {
                event.preventDefault();
                let title = document.getElementById('trackTitle').value;
                let album = document.getElementById('albumTitle').value;
                let artist = document.getElementById('artist').value;
                let inputs = document.getElementById('otherArtists').querySelectorAll('input');
                let others = Array.from(inputs).map(input => input.value)
                let genre = document.getElementById('genre').value;
                
                let response = await fetch('track', {
                    method: 'POST',
                    headers: {
                        'Content-Type':'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({title, albumTitle: album, artist, others, genre})
                })
                if (response.ok){
                    alert('Track added successfully!');
                } else {
                    alert('Failed to add track. Please try again.');
                }
            })
        </script>
    </body>
</html>
